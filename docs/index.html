<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#0b0e14">
<title>ArabWatch — البث المباشر للقنوات العربية والخليجية</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='85'>📡</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0b0e14;--bg2:#111520;--bg3:#161b27;--panel:#1a2030;--panel2:#1f2740;
--accent:#3b82f6;--accent2:#60a5fa;--green:#10b981;--red:#ef4444;--amber:#f59e0b;--purple:#a78bfa;--cyan:#22d3ee;--pink:#f472b6;
--tx:#e2e8f0;--t2:#94a3b8;--t3:#475569;--t4:#334155;
--bd:#1e293b;--bd2:#2d3b52;
--f:'Tajawal',system-ui,sans-serif;--mono:'IBM Plex Mono',monospace;
--hdr:52px;--sb:220px;--tb:40px}
html,body{font-family:var(--f);background:var(--bg);color:var(--tx);height:100%;overflow:hidden}

/* ═══ HEADER ═══ */
.hdr{height:var(--hdr);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;padding:0 16px;position:relative;z-index:100}
.hdr::after{content:'';position:absolute;bottom:-1px;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);opacity:.3}
.brand{display:flex;align-items:center;gap:10px}
.brand-icon{font-size:1.4rem;filter:drop-shadow(0 0 8px rgba(59,130,246,.4))}
.brand h1{font-weight:900;font-size:1.15rem;letter-spacing:-.5px;background:linear-gradient(135deg,var(--tx),var(--accent2));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.brand-tag{font-size:.55rem;color:var(--t3);font-weight:400;display:block;margin-top:-2px;-webkit-text-fill-color:var(--t3)}
.live-badge{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:4px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.25);font-size:.6rem;color:var(--red);font-weight:700;font-family:var(--mono);letter-spacing:1px}
.live-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.hdr-r{display:flex;align-items:center;gap:10px}
.clock{font-family:var(--mono);font-size:.72rem;color:var(--t2);direction:ltr;padding:4px 10px;background:var(--bg3);border-radius:4px;border:1px solid var(--bd)}
.hdr-link{font-size:.65rem;color:var(--t3);text-decoration:none;padding:4px 10px;border-radius:4px;border:1px solid var(--bd);transition:all .15s}
.hdr-link:hover{color:var(--accent);border-color:var(--accent)}

/* ═══ LAYOUT ═══ */
.wrap{display:flex;height:calc(100vh - var(--hdr))}

/* ═══ SIDEBAR ═══ */
.sb{width:var(--sb);background:var(--bg2);border-left:1px solid var(--bd);overflow-y:auto;flex-shrink:0;padding:8px 0}
.sb::-webkit-scrollbar{width:3px}.sb::-webkit-scrollbar-track{background:transparent}.sb::-webkit-scrollbar-thumb{background:var(--bd);border-radius:2px}
.sb-cat{padding:0 8px;margin-bottom:2px}
.sb-cat-t{font-size:.5rem;color:var(--t3);text-transform:uppercase;letter-spacing:2px;padding:10px 8px 4px;font-weight:800;display:flex;align-items:center;gap:5px}
.sb-cat-t::after{content:'';flex:1;height:1px;background:var(--bd)}
.ch{display:flex;align-items:center;gap:8px;padding:7px 10px;border-radius:6px;cursor:pointer;transition:all .1s;margin:1px 0;position:relative}
.ch:hover{background:var(--panel)}
.ch.on{background:var(--accent);color:#fff}
.ch.on .ch-sub{color:rgba(255,255,255,.6)}
.ch-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0;box-shadow:0 0 6px currentColor}
.ch-info{flex:1;min-width:0}
.ch-name{font-size:.72rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch-sub{font-size:.5rem;color:var(--t3)}
.ch-flag{font-size:.85rem;flex-shrink:0}

/* ═══ MAIN ═══ */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ═══ TOOLBAR ═══ */
.tb{height:var(--tb);background:var(--bg2);border-bottom:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:6px;overflow-x:auto}
.tb::-webkit-scrollbar{display:none}
.tb-sep{width:1px;height:20px;background:var(--bd);flex-shrink:0;margin:0 4px}
.tb-label{font-size:.58rem;color:var(--t3);font-weight:600;letter-spacing:.5px;white-space:nowrap;margin-left:4px}
.gb{width:30px;height:28px;border-radius:5px;background:var(--bg3);border:1px solid var(--bd);color:var(--t2);font-size:.65rem;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:600;transition:all .1s;flex-shrink:0}
.gb:hover{border-color:var(--accent)}.gb.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 0 12px rgba(59,130,246,.25)}
.cf{padding:4px 12px;border-radius:14px;background:var(--bg3);border:1px solid var(--bd);color:var(--t2);font-size:.6rem;cursor:pointer;font-family:var(--f);font-weight:600;transition:all .1s;white-space:nowrap;flex-shrink:0}
.cf:hover{border-color:var(--accent);color:var(--accent)}.cf.on{background:var(--accent);color:#fff;border-color:var(--accent)}

/* ═══ VIDEO GRID ═══ */
.vg{flex:1;display:grid;gap:1px;background:var(--bd);overflow:hidden}
.vg.g1{grid-template-columns:1fr}
.vg.g2{grid-template-columns:1fr 1fr}
.vg.g4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.vg.g6{grid-template-columns:repeat(3,1fr);grid-template-rows:1fr 1fr}
.vg.g9{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr)}
.vc{position:relative;background:var(--bg);overflow:hidden;min-height:0}
.vc iframe{width:100%;height:100%;border:none;display:block}
.vc-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(transparent,rgba(0,0,0,.9));padding:10px 12px 8px;display:flex;align-items:flex-end;justify-content:space-between;pointer-events:none}
.vc-name{font-size:.68rem;font-weight:700;color:#fff;display:flex;align-items:center;gap:5px;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.vc-live{font-size:.45rem;color:var(--red);font-weight:700;font-family:var(--mono);letter-spacing:1.5px;display:flex;align-items:center;gap:3px}
.vc-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--red);animation:blink 1.2s infinite}
.vc-empty{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:.78rem;flex-direction:column;gap:10px;height:100%;background:var(--bg2)}
.vc-empty-icon{font-size:2.5rem;opacity:.3}
.vc-empty-txt{font-size:.65rem;color:var(--t3)}

/* ═══ STATUSBAR ═══ */
.sbar{height:24px;background:var(--bg2);border-top:1px solid var(--bd);display:flex;align-items:center;padding:0 12px;gap:16px;font-size:.5rem;color:var(--t3);font-family:var(--mono)}
.sbar-dot{width:5px;height:5px;border-radius:50%;background:var(--green)}
.sbar-item{display:flex;align-items:center;gap:4px}

/* ═══ MOBILE ═══ */
@media(max-width:768px){
  .sb{display:none}
  .wrap{flex-direction:column}
  .mob-bar{display:flex;gap:5px;overflow-x:auto;padding:6px 10px;background:var(--bg2);border-bottom:1px solid var(--bd);-webkit-overflow-scrolling:touch;flex-shrink:0}
  .mob-bar::-webkit-scrollbar{display:none}
  .mob-ch{flex:0 0 auto;padding:5px 12px;border-radius:14px;background:var(--panel);font-size:.62rem;white-space:nowrap;cursor:pointer;border:1px solid var(--bd);font-family:var(--f);font-weight:600;color:var(--t2)}
  .mob-ch.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .vg.g4,.vg.g6,.vg.g9{grid-template-columns:1fr 1fr}
  .tb{flex-wrap:nowrap}
  .brand-tag{display:none}
}
@media(min-width:769px){.mob-bar{display:none}}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <div class="brand">
    <span class="brand-icon">📡</span>
    <div>
      <h1>ArabWatch<span class="brand-tag">البث المباشر — قنوات عربية وخليجية</span></h1>
    </div>
    <span class="live-badge">LIVE</span>
  </div>
  <div class="hdr-r">
    <div class="clock" id="clock">--:--:--</div>
    <a href="https://github.com/SiteQ8/ArabWatch" target="_blank" class="hdr-link">GitHub ↗</a>
  </div>
</div>

<!-- MOBILE CHANNEL BAR -->
<div class="mob-bar" id="mob"></div>

<div class="wrap">
  <!-- SIDEBAR -->
  <div class="sb" id="sb"></div>

  <!-- MAIN AREA -->
  <div class="main">
    <!-- TOOLBAR -->
    <div class="tb">
      <span class="tb-label">العرض</span>
      <button class="gb on" onclick="gSet(1)" id="g1">1</button>
      <button class="gb" onclick="gSet(2)" id="g2">2</button>
      <button class="gb" onclick="gSet(4)" id="g4">4</button>
      <button class="gb" onclick="gSet(6)" id="g6">6</button>
      <button class="gb" onclick="gSet(9)" id="g9">9</button>
      <div class="tb-sep"></div>
      <span class="tb-label">التصنيف</span>
      <button class="cf on" onclick="fCat('all',this)">📺 الكل</button>
      <button class="cf" onclick="fCat('أخبار',this)">📰 أخبار</button>
      <button class="cf" onclick="fCat('الكويت',this)">🇰🇼 الكويت</button>
      <button class="cf" onclick="fCat('السعودية',this)">🇸🇦 السعودية</button>
      <button class="cf" onclick="fCat('الإمارات',this)">🇦🇪 الإمارات</button>
      <button class="cf" onclick="fCat('خليجي',this)">🌊 خليجي</button>
      <button class="cf" onclick="fCat('مصر',this)">🇪🇬 مصر</button>
      <button class="cf" onclick="fCat('دينية',this)">🕌 دينية</button>
      <button class="cf" onclick="fCat('رياضة',this)">⚽ رياضة</button>
    </div>

    <!-- VIDEO GRID -->
    <div class="vg g1" id="vg"></div>

    <!-- STATUS BAR -->
    <div class="sbar">
      <div class="sbar-item"><span class="sbar-dot"></span> متصل</div>
      <div class="sbar-item" id="ch-count">0 قناة</div>
      <div class="sbar-item" id="grid-info">عرض: 1</div>
      <div style="flex:1"></div>
      <div class="sbar-item">ArabWatch v1.0 — Ali AlEnezi · @SiteQ8</div>
    </div>
  </div>
</div>

<script>
// ═══ CHANNELS DATABASE — 35+ Arabic & Gulf channels ═══
var CH=[
// ─── أخبار عالمية ───
{n:'الجزيرة',y:'pHjmSblYX1A',c:'أخبار',f:'🇶🇦',cl:'#d4a017',sub:'Al Jazeera Arabic'},
{n:'العربية',y:'1Rx_p3-G7ak',c:'أخبار',f:'🇸🇦',cl:'#c0392b',sub:'Al Arabiya'},
{n:'الحدث',y:'BN1Gc9xJoLU',c:'أخبار',f:'🇸🇦',cl:'#e74c3c',sub:'Al Hadath'},
{n:'سكاي نيوز عربية',y:'skv1D3_hKMg',c:'أخبار',f:'🇦🇪',cl:'#2563eb',sub:'Sky News Arabia'},
{n:'BBC عربي',y:'hLsJCluzJrs',c:'أخبار',f:'🇬🇧',cl:'#9333ea',sub:'BBC Arabic'},
{n:'فرنسا 24',y:'UBzzXGbGO3I',c:'أخبار',f:'🇫🇷',cl:'#0284c7',sub:'France 24 Arabic'},
{n:'DW عربي',y:'wMcSsOkqYZ8',c:'أخبار',f:'🇩🇪',cl:'#0891b2',sub:'DW Arabic'},
{n:'RT عربي',y:'P0YiAZpBGOQ',c:'أخبار',f:'🇷🇺',cl:'#16a34a',sub:'RT Arabic'},
{n:'الغد',y:'ur3xRLBZyPk',c:'أخبار',f:'🌍',cl:'#059669',sub:'Al Ghad'},
{n:'TRT عربي',y:'CV6FVB9jk1I',c:'أخبار',f:'🇹🇷',cl:'#ea580c',sub:'TRT Arabic'},
{n:'الجزيرة مباشر',y:'EwuIptsmUTI',c:'أخبار',f:'🇶🇦',cl:'#ca8a04',sub:'Al Jazeera Mubasher'},
{n:'CGTN عربي',y:'DqZjGFjKHjw',c:'أخبار',f:'🇨🇳',cl:'#dc2626',sub:'CGTN Arabic'},

// ─── الكويت ───
{n:'تلفزيون الكويت',y:'b3XwOlbEVBU',c:'الكويت',f:'🇰🇼',cl:'#007a3d',sub:'KTV'},
{n:'الكويت الرياضية',y:'LcC9x_6DgNY',c:'الكويت',f:'🇰🇼',cl:'#007a3d',sub:'Kuwait Sports'},
{n:'مجلس الأمة',y:'WyI2O41jjIA',c:'الكويت',f:'🇰🇼',cl:'#007a3d',sub:'National Assembly'},
{n:'الكويت بلس',y:'3J2VVBpGaYo',c:'الكويت',f:'🇰🇼',cl:'#007a3d',sub:'Kuwait Plus'},

// ─── السعودية ───
{n:'القناة السعودية',y:'ByMbFHkVqRc',c:'السعودية',f:'🇸🇦',cl:'#006c35',sub:'Saudi TV'},
{n:'SBC السعودية',y:'9nWzpAiS8hQ',c:'السعودية',f:'🇸🇦',cl:'#006c35',sub:'SBC'},
{n:'الإخبارية',y:'4gJnR0lOi5g',c:'السعودية',f:'🇸🇦',cl:'#006c35',sub:'Al Ekhbariya'},
{n:'قناة ٢٤',y:'hYBYEgSbdMs',c:'السعودية',f:'🇸🇦',cl:'#006c35',sub:'24 Saudi'},
{n:'روتانا خليجية',y:'LxeBuOYqJgk',c:'السعودية',f:'🇸🇦',cl:'#7c3aed',sub:'Rotana Khalijia'},

// ─── الإمارات ───
{n:'أبوظبي',y:'jkkXPgEndPg',c:'الإمارات',f:'🇦🇪',cl:'#b91c1c',sub:'Abu Dhabi TV'},
{n:'دبي',y:'EwOSjE69OBE',c:'الإمارات',f:'🇦🇪',cl:'#1d4ed8',sub:'Dubai TV'},
{n:'الشارقة',y:'_qxpgKdCYQo',c:'الإمارات',f:'🇦🇪',cl:'#7e22ce',sub:'Sharjah TV'},
{n:'سما دبي',y:'j5OChXCIm2A',c:'الإمارات',f:'🇦🇪',cl:'#0369a1',sub:'Sama Dubai'},

// ─── خليجي ───
{n:'قطر',y:'OPBuzqAezRA',c:'خليجي',f:'🇶🇦',cl:'#7f1d1d',sub:'Qatar TV'},
{n:'عُمان',y:'l6tK1TuCbMs',c:'خليجي',f:'🇴🇲',cl:'#dc2626',sub:'Oman TV'},
{n:'البحرين',y:'jvyDfxLOiDY',c:'خليجي',f:'🇧🇭',cl:'#e11d48',sub:'Bahrain TV'},

// ─── مصر ───
{n:'القاهرة والناس',y:'fZknLAntfKY',c:'مصر',f:'🇪🇬',cl:'#ca8a04',sub:'Al Kahera Wal Nas'},
{n:'المحور',y:'djKDMHRqGCA',c:'مصر',f:'🇪🇬',cl:'#dc2626',sub:'Al Mehwar'},
{n:'الحياة',y:'xzqLTmBuaOk',c:'مصر',f:'🇪🇬',cl:'#0891b2',sub:'Al Hayat'},

// ─── دينية ───
{n:'القرآن الكريم',y:'BUiLGRojAhI',c:'دينية',f:'🕌',cl:'#166534',sub:'Quran Kareem'},
{n:'السنة النبوية',y:'3KUZqG0mvPo',c:'دينية',f:'🕌',cl:'#14532d',sub:'Sunnah Channel'},
{n:'اقرأ',y:'TN2kxYuH3KQ',c:'دينية',f:'🕌',cl:'#15803d',sub:'Iqraa'},
{n:'المجد',y:'xq_FPnhg3Sw',c:'دينية',f:'🕌',cl:'#1e3a5f',sub:'Al Majd'},

// ─── رياضة ───
{n:'beIN SPORTS',y:'NfGQ3xoBYrA',c:'رياضة',f:'⚽',cl:'#059669',sub:'beIN News'},
{n:'SSC السعودية',y:'5v-TSsVRYZ0',c:'رياضة',f:'⚽',cl:'#7c3aed',sub:'SSC Sports'},
{n:'أبوظبي الرياضية',y:'SzKXAIvPjxQ',c:'رياضة',f:'⚽',cl:'#b91c1c',sub:'AD Sports'},
];

var gs=1,active=[],curCat='all';

// ═══ SIDEBAR RENDER ═══
function rSb(){
  var cats={};CH.forEach(function(c,i){if(!cats[c.c])cats[c.c]=[];cats[c.c].push({ch:c,idx:i})});
  var h='';
  var catIcons={'أخبار':'📰','الكويت':'🇰🇼','السعودية':'🇸🇦','الإمارات':'🇦🇪','خليجي':'🌊','مصر':'🇪🇬','دينية':'🕌','رياضة':'⚽'};
  Object.keys(cats).forEach(function(cat){
    if(curCat!=='all'&&cat!==curCat)return;
    h+='<div class="sb-cat"><div class="sb-cat-t">'+(catIcons[cat]||'')+' '+cat+'</div>';
    cats[cat].forEach(function(o){
      var on=active.indexOf(o.idx)!==-1;
      h+='<div class="ch'+(on?' on':'')+'" onclick="tCh('+o.idx+')">';
      h+='<div class="ch-dot" style="color:'+o.ch.cl+';background:'+o.ch.cl+'"></div>';
      h+='<div class="ch-info"><div class="ch-name">'+o.ch.n+'</div><div class="ch-sub">'+o.ch.sub+'</div></div>';
      h+='<span class="ch-flag">'+o.ch.f+'</span></div>'});
    h+='</div>'});
  document.getElementById('sb').innerHTML=h;

  // Mobile
  var mh='';CH.forEach(function(c,i){
    if(curCat!=='all'&&c.c!==curCat)return;
    var on=active.indexOf(i)!==-1;
    mh+='<div class="mob-ch'+(on?' on':'')+'" onclick="tCh('+i+')">'+c.f+' '+c.n+'</div>'});
  document.getElementById('mob').innerHTML=mh;
}

// ═══ TOGGLE CHANNEL ═══
function tCh(i){
  var p=active.indexOf(i);
  if(p!==-1){active.splice(p,1)}
  else{if(active.length>=gs)active.shift();active.push(i)}
  rSb();rVg();
}

// ═══ GRID SIZE ═══
function gSet(n){
  gs=n;
  document.querySelectorAll('.gb').forEach(function(b){b.classList.remove('on')});
  document.getElementById('g'+n).classList.add('on');
  while(active.length>n)active.shift();
  document.getElementById('grid-info').textContent='عرض: '+n;
  rVg();
}

// ═══ CATEGORY FILTER ═══
function fCat(cat,btn){
  curCat=cat;
  document.querySelectorAll('.cf').forEach(function(b){b.classList.remove('on')});
  btn.classList.add('on');
  active=[];
  var filtered=CH.filter(function(c){return cat==='all'||c.c===cat});
  for(var i=0;i<Math.min(gs,filtered.length);i++){active.push(CH.indexOf(filtered[i]))}
  rSb();rVg();
}

// ═══ RENDER VIDEO GRID ═══
function rVg(){
  var g=document.getElementById('vg');
  g.className='vg g'+gs;
  var h='';
  for(var i=0;i<gs;i++){
    if(i<active.length){
      var c=CH[active[i]];
      h+='<div class="vc">';
      h+='<iframe src="https://www.youtube.com/embed/'+c.y+'?autoplay=1&mute=1&rel=0&modestbranding=1&playsinline=1&controls=1" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen loading="lazy"></iframe>';
      h+='<div class="vc-info"><span class="vc-name">'+c.f+' '+c.n+'</span><span class="vc-live">LIVE</span></div>';
      h+='</div>'}
    else{
      h+='<div class="vc"><div class="vc-empty"><span class="vc-empty-icon">📡</span><div class="vc-empty-txt">اختر قناة من القائمة الجانبية</div></div></div>'}}
  g.innerHTML=h;
  document.getElementById('ch-count').textContent=active.length+'/'+CH.length+' قناة';
}

// ═══ CLOCK ═══
function uClk(){
  var n=new Date();
  var opts={hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false,timeZone:'Asia/Kuwait'};
  document.getElementById('clock').textContent=n.toLocaleTimeString('en-US',opts)+' KWT';
  setTimeout(uClk,1000)}
uClk();

// ═══ INIT ═══
active=[0];
rSb();
rVg();
</script>
</body>
</html>
